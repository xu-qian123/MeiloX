name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_notes:
        description: '发布说明（可选，默认使用 .github/release_notes.md）'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Tests, lint and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify with the repository Wrapper
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --continue --console=plain

      - name: Check packaged native libraries for 16 KB pages
        if: always() && !cancelled()
        run: python3 scripts/verify_native_page_size.py app/build/outputs/apk/debug/app-debug.apk --json-output app/build/reports/native-page-size-debug.json

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/reports/native-page-size-debug.json
          if-no-files-found: warn

  build:
    if: github.event_name != 'pull_request'
    needs: verify
    environment: release
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.release_metadata.outputs.artifact_name }}
      release_name: ${{ steps.release_metadata.outputs.release_name }}
      tag_name: ${{ steps.release_metadata.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release with the repository Wrapper
        run: >-
          ./gradlew :app:assembleRelease --console=plain
          -Pmei.buildCommitSha=${{ github.sha }}
          -Pmei.ciRunNumber=${{ github.run_number }}
          -Pmei.ciRunAttempt=${{ github.run_attempt }}

      - name: Check release native libraries for 16 KB pages
        run: python3 scripts/verify_native_page_size.py app/build/outputs/apk/release/app-release.apk --json-output app/build/reports/native-page-size-release.json

      - uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Read release metadata
        id: release_metadata
        shell: bash
        run: |
          metadata_file="app/build/outputs/apk/release/output-metadata.json"
          version_name="$(jq -r '.elements[0].versionName // empty' "$metadata_file")"

          if [[ ! "$version_name" =~ ^[0-9]+(\.[0-9]+)+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid Android versionName for release tag: $version_name"
            exit 1
          fi

          release_date="$(TZ=Asia/Hong_Kong date +%y%m%d)"
          echo "artifact_name=MeiloX-${version_name}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_date}_${version_name}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${version_name}" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        env:
          SIGNED_RELEASE_FILE: ${{ steps.sign_app.outputs.signedReleaseFile }}
        run: mv "$SIGNED_RELEASE_FILE" app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release_metadata.outputs.artifact_name }}
          path: app-release.apk
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-artifact

      - name: Read release notes
        id: release_notes
        shell: bash
        env:
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
          TAG_NAME: ${{ needs.build.outputs.tag_name }}
        run: |
          if [[ -n "$INPUT_RELEASE_NOTES" ]]; then
            body="$INPUT_RELEASE_NOTES"
          elif [[ -f .github/release_notes.md ]]; then
            body="$(cat .github/release_notes.md)"
          else
            body="Release ${TAG_NAME}"
          fi

          delimiter="RELEASE_NOTES_${RANDOM}_${RANDOM}"
          {
            echo "body<<${delimiter}"
            echo "$body"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        uses: ncipollo/release-action@v1
        with:
          artifacts: release-artifact/app-release.apk
          artifactContentType: application/vnd.android.package-archive
          artifactErrorsFailBuild: true
          body: ${{ steps.release_notes.outputs.body }}
          commit: ${{ github.sha }}
          generateReleaseNotes: true
          makeLatest: true
          name: ${{ needs.build.outputs.release_name }}
          prerelease: ${{ contains(needs.build.outputs.tag_name, '-') }}
          tag: ${{ needs.build.outputs.tag_name }}
          token: ${{ github.token }}
